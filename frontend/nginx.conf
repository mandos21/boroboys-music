map $request_uri $preview_id {
    default default;
    "~^/rounds/(?<preview_round_id>[0-9a-fA-F-]{36})/?(?:\?.*)?$" $preview_round_id;
}

server {
    # 8080 because the container runs unprivileged and cannot bind 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS/HSTS belongs at the TLS-terminating reverse proxy. These headers are
    # safe for both the local HTTP container and the deployed frontend.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self' data:" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML subrequests deliberately carry no user identity. This endpoint can
    # render only the public preview contract; failures use the built-in stub.
    location /__preview/ {
        internal;
        proxy_pass http://api:8000/api/v1/previews/;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
    }

    location = /index.html {
        ssi on;
        # Never let static-file validators cache a different round's head, or
        # keep a relative deadline alive past the next fresh page request.
        etag off;
        if_modified_since off;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
