name: CI

on:
  pull_request:
  push:
    branches: [main, v2-rebuild]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: music_rounds
          POSTGRES_USER: music_rounds
          POSTGRES_PASSWORD: music_rounds
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U music_rounds -d music_rounds"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://music_rounds:music_rounds@localhost:5432/music_rounds
      PROCRASTINATE_DATABASE_URL: postgresql://music_rounds:music_rounds@localhost:5432/music_rounds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: abatilo/actions-poetry@v3
        with: { poetry-version: "2.1.1" }
      - run: poetry install --with dev
      - run: poetry run ruff check .
      - run: poetry run mypy app
      - run: poetry run alembic upgrade head
      - run: poetry run alembic check
      - run: poetry run procrastinate --app=app.tasks.app schema --apply
      - run: poetry run python scripts/generate_openapi.py > /tmp/openapi.json && diff -u openapi.json /tmp/openapi.json
      - run: poetry run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run generate:api && git diff --exit-code -- src/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
