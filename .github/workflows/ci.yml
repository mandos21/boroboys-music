name: CI

on:
  pull_request:
  push:
    branches: [main, v2-rebuild]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: music_rounds
          POSTGRES_USER: music_rounds
          POSTGRES_PASSWORD: music_rounds
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U music_rounds -d music_rounds"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://music_rounds:music_rounds@localhost:5432/music_rounds
      PROCRASTINATE_DATABASE_URL: postgresql://music_rounds:music_rounds@localhost:5432/music_rounds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: abatilo/actions-poetry@v3
        with: { poetry-version: "2.1.1" }
      - run: poetry install --with dev
      - run: poetry run ruff check .
      - run: poetry run ruff format --check app tests
      - run: poetry run mypy app
      - run: poetry run alembic upgrade head
      - run: poetry run alembic check
      - run: PGPASSWORD=music_rounds createdb -h localhost -U music_rounds music_rounds_test
      - run: DATABASE_URL=postgresql+psycopg://music_rounds:music_rounds@localhost:5432/music_rounds_test poetry run alembic upgrade head
      - run: poetry run python scripts/generate_openapi.py > /tmp/openapi.json && diff -u openapi.json /tmp/openapi.json
      - run: TEST_DATABASE_URL=postgresql+psycopg://music_rounds:music_rounds@localhost:5432/music_rounds_test poetry run pytest

  frontend:
    runs-on: ubuntu-latest
    # Visual snapshots are only pixel-stable inside the exact OS/font/browser
    # combination Playwright ships in its own image. Running on bare
    # ubuntu-latest (whatever font/freetype packages that image currently
    # carries) made every visual test flake by ~1% of pixels regardless of
    # which page changed, because the runner's font rendering drifted out
    # from under the committed baselines. Pin the container to the exact
    # @playwright/test version in package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    defaults:
      run:
        working-directory: frontend
    steps:
      # The Playwright image has no git, so actions/checkout would otherwise
      # silently fall back to a non-git tarball download, leaving later git
      # commands (the generated-schema diff below) with no repository at all.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run generate:api && git diff --exit-code -- src/api/schema.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      # Browsers matching this exact Playwright version are already bundled
      # in the container image; installing again here would be redundant.
      - run: npm run test:visual
      - run: npm run test:a11y

  images:
    # The API image was unbuildable for some time because nothing here ever
    # built it: the jobs above run Poetry and npm directly on the runner, so a
    # broken Dockerfile could not fail the pipeline. This job builds both
    # deployment artifacts and boots the API against a real database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: music_rounds
          POSTGRES_USER: music_rounds
          POSTGRES_PASSWORD: music_rounds
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U music_rounds -d music_rounds"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t music-rounds-api ./backend
      - run: docker build -t music-rounds-web ./frontend
      - name: Both images run unprivileged
        run: |
          test "$(docker run --rm music-rounds-api id -u)" != "0"
          test "$(docker run --rm --entrypoint id music-rounds-web -u)" != "0"
      - name: API migrates and serves
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+psycopg://music_rounds:music_rounds@localhost:5432/music_rounds \
            -e PROCRASTINATE_DATABASE_URL=postgresql://music_rounds:music_rounds@localhost:5432/music_rounds \
            music-rounds-api \
            sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000'
          for _ in $(seq 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/v1/health || (docker logs api && exit 1)
      - name: Frontend image serves the built app
        run: |
          # nginx resolves the api upstream at config load, so it needs the
          # name to exist even though this check never proxies through it.
          docker run -d --name web -p 8080:8080 --add-host api:127.0.0.1 music-rounds-web
          for _ in $(seq 30); do
            curl -sf http://localhost:8080/ && break
            sleep 1
          done
          curl -sf http://localhost:8080/ | grep -q '<div id="root">' || (docker logs web && exit 1)
