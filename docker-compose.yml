services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: music_rounds
      POSTGRES_USER: music_rounds
      POSTGRES_PASSWORD: music_rounds
    ports:
      # The application containers reach PostgreSQL over the compose network.
      # Keep the published port on the local host for psql and backups only.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_rounds -d music_rounds"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: ./backend
    # Named so the worker can run the same artifact rather than building the
    # identical Dockerfile a second time into an image that can drift from it.
    image: music-rounds-api
    env_file:
      - .env
    ports:
      # The browser reaches the API through the web container. Keep direct API
      # access (including Prometheus metrics) on the local host.
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://music_rounds:music_rounds@postgres:5432/music_rounds
      PROCRASTINATE_DATABASE_URL: postgresql://music_rounds:music_rounds@postgres:5432/music_rounds
    # The image puts the virtualenv on PATH, so Poetry stays a build-time tool
    # and is never needed to start the process.
    command: >-
      sh -c 'alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    restart: unless-stopped
    image: music-rounds-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://music_rounds:music_rounds@postgres:5432/music_rounds
      PROCRASTINATE_DATABASE_URL: postgresql://music_rounds:music_rounds@postgres:5432/music_rounds
    command: ["procrastinate", "--app=app.tasks.app", "worker"]
    depends_on:
      api:
        condition: service_healthy

  web:
    restart: unless-stopped
    build:
      context: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
