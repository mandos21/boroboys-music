services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: music_rounds
      POSTGRES_USER: music_rounds
      POSTGRES_PASSWORD: music_rounds
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music_rounds -d music_rounds"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
