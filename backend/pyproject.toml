[tool.poetry]
name = "boroboys-music"
version = "0.1.0"
description = "Monthly Spotify playlist curator with FastAPI UI and Last.fm insights"
authors = ["Matt <matt@example.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
spotipy = "^2.23.0"
pylast = "^5.4.0"
sqlalchemy = "^2.0.30"
alembic = "^1.13.2"
psycopg = { extras = ["binary"], version = "^3.2.1" }
pydantic = "^2.7.4"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.1"
apscheduler = "^3.10.4"
httpx = "^0.27.0"
loguru = "^0.7.2"
bcrypt = "^4.2.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.5"}
python-multipart = "^0.0.9"
jinja2 = "^3.1.4"
itsdangerous = "^2.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-mock = "^3.14.0"
ruff = "^0.5.6"
black = "^24.8.0"

[build-system]
requires = ["poetry-core>=1.8.2"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "B", "UP", "S", "C4"]
ignore = ["B008", "S101"]

[tool.black]
line-length = 100
target-version = ["py310"]
