[tool.poetry]
name = "music-rounds-api"
version = "0.1.0"
description = "API and background tasks for Music Rounds"
authors = ["Music Rounds contributors"]
package-mode = true
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
psycopg = { extras = ["binary"], version = "^3.2.0" }
pydantic-settings = "^2.6.0"
procrastinate = "^3.7.0"
prometheus-client = "^0.21.0"
authlib = "^1.3.2"
cryptography = "^44.0.0"
httpx = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.16"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
# The runtime is 3.14; this stays a version back on purpose. At py314 the
# formatter adopts PEP 758 and strips the parentheses from multi-type `except`
# clauses - but only those without an `as` binding, which still require them.
# That leaves both forms side by side in one file, and the unparenthesised one
# reads exactly like Python 2's `except E, name:`. Raise this to py314 if that
# syntax becomes familiar enough to be worth the churn.
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these; reformatting them would diverge from what
# `alembic revision --autogenerate` produces next time.
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["app"]
